<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('input');
            
            inputs.forEach(input => {
                input.addEventListener('focus', () => {
                    const icon = input.previousElementSibling;
                    if (icon) {
                        icon.classList.add('text-primary-fixed-dim');
                        icon.style.fontVariationSettings = "'FILL' 1";
                    }
                });
                
                input.addEventListener('blur', () => {
                    const icon = input.previousElementSibling;
                    if (icon) {
                        icon.classList.remove('text-primary-fixed-dim');
                        icon.style.fontVariationSettings = "'FILL' 0";
                    }
                });
            });

            // Simulated profile picture behavior
            const pfpButton = document.querySelector('[aria-label="Upload photo"]');
            pfpButton.addEventListener('click', () => {
                const ripples = document.createElement('div');
                ripples.className = 'absolute inset-0 bg-white/20 rounded-full animate-ping';
                pfpButton.appendChild(ripples);
                setTimeout(() => ripples.remove(), 600);
                alert("Opening system gallery...");
            });
        });
    </script>

<script>
(function() {
  const toggleBtn = document.getElementById('view-toggle');
  const vendorList = document.getElementById('vendor-list');
  const icon = toggleBtn.querySelector('.material-symbols-outlined');

  toggleBtn.addEventListener('click', () => {
    const isList = vendorList.classList.contains('view-mode-list');
    
    if (isList) {
      vendorList.classList.remove('view-mode-list', 'flex-col');
      vendorList.classList.add('view-mode-grid', 'grid', 'grid-cols-2', 'gap-4');
      icon.textContent = 'view_list';
    } else {
      vendorList.classList.remove('view-mode-grid', 'grid', 'grid-cols-2', 'gap-4');
      vendorList.classList.add('view-mode-list', 'flex-col');
      icon.textContent = 'grid_view';
    }
  });
})();

name: onway_market
description: "OnWay Market - Real-time hyperlocal mobile marketplace"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management (BLoC)
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  equatable: ^2.0.7

  # Navigation
  go_router: ^15.1.3

  # Networking
  dio: ^5.8.0+1
  
  # Socket.IO
  socket_io_client: ^3.0.2

  # Google Fonts
  google_fonts: ^6.2.1
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  http: ^1.6.0
  geolocator: ^13.0.2
  shared_preferences: ^2.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

<script>
        // Simple OTP auto-focus logic
        const inputs = document.querySelectorAll('.otp-input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // Simple Countdown Timer Logic
        let seconds = 45;
        const timerElement = document.getElementById('resend-timer');
        const countdown = setInterval(() => {
            seconds--;
            const displaySec = seconds < 10 ? `0${seconds}` : seconds;
            timerElement.textContent = `Resend in 00:${displaySec}`;
            
            if (seconds <= 0) {
                clearInterval(countdown);
                timerElement.textContent = 'Resend Now';
                timerElement.classList.remove('opacity-50', 'cursor-default');
                timerElement.classList.add('cursor-pointer', 'hover:underline', 'opacity-100');
            }
        }, 1000);
    </script>

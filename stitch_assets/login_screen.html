<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            -webkit-tap-highlight-color: transparent;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(34, 197, 94, 0.05);
        }

        .input-glow:focus-within {
            box-shadow: 0 0 0 2px theme('colors.primary-container'), 0 4px 12px rgba(34, 197, 94, 0.2);
            border-color: transparent;
        }

        .btn-gradient {
            background: linear-gradient(135deg, theme('colors.primary-container'), theme('colors.secondary'));
        }

        /* Orbital Animation Styles */
        .orbital-container {
            position: relative;
            width: 240px;
            height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .orbit-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 1px dashed theme('colors.primary-container');
            opacity: 0.3;
            animation: spin 20s linear infinite;
        }
        
        .orbit-ring-2 {
            position: absolute;
            width: 130%;
            height: 130%;
            border-radius: 50%;
            border: 1px solid theme('colors.surface-variant');
            opacity: 0.5;
            animation: spin 30s linear infinite reverse;
        }

        .comet {
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: theme('colors.primary-container');
            border-radius: 50%;
            top: -6px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 10px theme('colors.primary-container'), 0 0 20px theme('colors.primary-container');
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        /* Entrance Animations */
        .fade-in-up {
            opacity: 0;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .delay-100 { animation-delay: 0.1s; }
        .delay-200 { animation-delay: 0.2s; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Floating Background */
        .float-bg {
            animation: floatBg 20s ease-in-out infinite;
        }
        @keyframes floatBg {
            0%, 100% { transform: translateY(0) scale(1.05); }
            50% { transform: translateY(-20px) scale(1.05); }
        }

        /* Button Pulse */
        .btn-pulse {
            animation: btnPulse 2s infinite;
        }
        @keyframes btnPulse {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
    </style>

<script>
        // Simple input formatting for demonstration (US format)
        const phoneInput = document.getElementById('mobile');
        if(phoneInput) {
            phoneInput.addEventListener('input', function (e) {
                let x = e.target.value.replace(/\D/g, '').match(/(\d{0,3})(\d{0,3})(\d{0,4})/);
                e.target.value = !x[2] ? x[1] : '(' + x[1] + ') ' + x[2] + (x[3] ? '-' + x[3] : '');
            });
        }
    </script>
